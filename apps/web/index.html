<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telltale · Live safety ratings for Hyperliquid markets</title>
    <meta name="description" content="Every market on Hyperliquid graded A to E, with the numbers behind each grade: depth against open interest, the cost to move the price to liquidation levels, and how closely the market tracks its oracle." />
    <meta name="theme-color" content="#020909" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2FBFC" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the theme before first paint so the page never flashes the wrong one.
      try {
        const saved = localStorage.getItem("telltale-theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {
        document.documentElement.classList.toggle("dark", matchMedia("(prefers-color-scheme: dark)").matches);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
